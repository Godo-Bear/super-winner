# Deploys the whole game (website + online relay) as one Cloudflare Worker.
#   npm run deploy
name = "super-winner"
main = "worker/src/index.js"
compatibility_date = "2025-09-01"

# The built game (npm run build) is served as static files.
[assets]
directory = "./dist"
binding = "ASSETS"

# One Durable Object per room code. SQLite-backed classes work on the Workers free plan.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
